name: Build and deploy API to Plesk (FTP)
# Runs on SoftelligentSchoolSuitePro-API only — push suite-api master after backend/ changes (see backend/DEPLOY.md).
# Plesk/IIS: deploy renames web.config → web1.config, uploads app_offline.htm, waits, FTP upload, then restores.
# Use a dedicated FTP user whose Plesk home IS the API site folder (sciencebaseschool.com).
# Secrets: FTP_SERVER (FTP hostname, e.g. sciencebaseschool.com), FTP_USERNAME, FTP_PASSWORD, FTP_PROTOCOL (optional).
# Upload target = FTP login root (site-scoped user). Do not use FTP_REMOTE_DIR.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  API_PROJECT: School.API/School.API.csproj
  PUBLISH_DIR: ./publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} -c Release --no-restore

      - name: Publish (verify)
        run: dotnet publish ${{ env.API_PROJECT }} -c Release --no-build -o ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    # ubuntu-latest is rolling to 26.04 through 19 Nov 2026; apt there has been failing the lftp install.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and publish
        run: |
          dotnet restore ${{ env.API_PROJECT }}
          dotnet publish ${{ env.API_PROJECT }} -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Verify publish output (API binaries)
        run: |
          set -euo pipefail
          test -f "${{ env.PUBLISH_DIR }}/School.API.dll"
          test -f "${{ env.PUBLISH_DIR }}/School.Application.dll"
          test -f "${{ env.PUBLISH_DIR }}/School.Infrastructure.dll"
          ls -la "${{ env.PUBLISH_DIR }}/School."*.dll

      - name: Verify deploy scripts
        run: |
          set -euo pipefail
          test -x scripts/ci-deploy-api-ftp.sh || chmod +x scripts/ci-deploy-api-ftp.sh
          test -x scripts/ci-restore-api-ftp.sh || chmod +x scripts/ci-restore-api-ftp.sh
          bash -n scripts/ci-deploy-api-ftp.sh
          bash -n scripts/ci-restore-api-ftp.sh
          head -1 scripts/ci-deploy-api-ftp.sh | grep -q '^#!/usr/bin/env bash$'

      - id: ftp-config
        name: Prepare FTP options
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          protocol="${FTP_PROTOCOL:-ftp}"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        id: install-lftp
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # Hosted runners resolve azure.archive.ubuntu.com to an IPv6 address that
          # accepts the connection and then sends nothing. apt waits on that mirror
          # until the job timeout. Use the main archive over IPv4 and kill a hung attempt.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo tee /etc/apt/apt.conf.d/99-no-hang >/dev/null <<'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update && sudo timeout 90 env DEBIAN_FRONTEND=noninteractive apt-get install -y lftp; then
              command -v lftp
              exit 0
            fi
            echo "::warning::lftp install failed (attempt ${attempt}/3). Retrying..."
            sleep 5
          done
          echo "::error::Could not install lftp after 3 attempts."
          exit 1

      - name: Stop IIS and upload publish (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ steps.ftp-config.outputs.protocol }}
        run: |
          chmod +x scripts/ci-deploy-api-ftp.sh
          scripts/ci-deploy-api-ftp.sh "${{ env.PUBLISH_DIR }}"

      - name: Start IIS app (restore web.config)
        if: always() && steps.install-lftp.outcome == 'success'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ steps.ftp-config.outputs.protocol }}
        run: |
          chmod +x scripts/ci-restore-api-ftp.sh
          scripts/ci-restore-api-ftp.sh
