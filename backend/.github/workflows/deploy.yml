name: Build and deploy API to Plesk (FTP)
# Plesk subscription FTP home (e.g. seicoscientific.com) contains sibling folders per site:
#   sciencebaseschool.com/     — addon domain (API / School.API.dll)
#   academics.sciencebaseschool.com/ — subdomain (UI dist)
# Secret on SoftelligentSchoolSuitePro-API (not the UI repo):
#   FTP_API_REMOTE_DIR = sciencebaseschool.com   (folder name under Home directory, no leading /)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  API_PROJECT: School.API/School.API.csproj
  PUBLISH_DIR: ./publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} -c Release --no-restore

      - name: Publish (verify)
        run: dotnet publish ${{ env.API_PROJECT }} -c Release --no-build -o ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and publish
        run: |
          dotnet restore ${{ env.API_PROJECT }}
          dotnet publish ${{ env.API_PROJECT }} -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Verify publish output (API binaries)
        run: |
          set -euo pipefail
          echo "Commit: ${{ github.sha }}"
          test -f "${{ env.PUBLISH_DIR }}/School.API.dll"
          test -f "${{ env.PUBLISH_DIR }}/School.Application.dll"
          test -f "${{ env.PUBLISH_DIR }}/School.Infrastructure.dll"
          ls -la "${{ env.PUBLISH_DIR }}/School."*.dll

      - id: ftp-remote
        name: Resolve Plesk domain folder for API
        env:
          FTP_API_REMOTE_DIR: ${{ secrets.FTP_API_REMOTE_DIR }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          dir="${FTP_API_REMOTE_DIR:-${FTP_REMOTE_DIR:-}}"
          dir="${dir// /}"
          dir="${dir#/}"
          dir="${dir%/}"
          if [ -z "$dir" ] || [ "$dir" = "." ]; then
            echo "::error::Set FTP_API_REMOTE_DIR to the Home-directory folder for the API site (e.g. sciencebaseschool.com), not subscription root."
            exit 1
          fi
          echo "Will cd into FTP folder: $dir"
          echo "remote_cd=$dir" >> "$GITHUB_OUTPUT"

      - id: ftp-config
        name: Prepare FTP options
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          protocol="${FTP_PROTOCOL:-ftp}"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to addon domain folder via FTP (explicit cd)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ steps.ftp-config.outputs.protocol }}
          REMOTE_CD: ${{ steps.ftp-remote.outputs.remote_cd }}
        run: |
          set -euo pipefail
          case "$FTP_PROTOCOL" in
            ftps|ftps-legacy) OPEN="ftps://$FTP_SERVER" ;;
            *) OPEN="$FTP_SERVER" ;;
          esac
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$OPEN" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          pwd
          cd $REMOTE_CD
          pwd
          lcd ${{ env.PUBLISH_DIR }}
          mirror --reverse --parallel=4 --verbose \
            --exclude-glob .git* \
            --exclude-glob appsettings.json \
            --exclude-glob 'appsettings.*.json'
          ls -la School.API.dll
          bye
          EOF
