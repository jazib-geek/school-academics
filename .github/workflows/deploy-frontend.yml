name: Deploy frontend to Plesk (FTP)
# Monorepo: runs only when frontend/ (or this file) changes — not with API deploy.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_DIR, FTP_REMOTE_DIR_DEMO (optional), FTP_PROTOCOL (optional)

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:demo

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install -g npm@11.6.2
      - run: npm ci

      - id: ftp-config
        name: Prepare FTP options
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          protocol="${FTP_PROTOCOL:-ftp}"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

      - id: ftp-server-dir-prod
        name: Prepare production FTP server-dir
        env:
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          dir="${FTP_REMOTE_DIR// /}"
          if [ -z "$dir" ]; then
            echo "::error::Set FTP_REMOTE_DIR to the FTP folder where the site files live (e.g. /httpdocs/)."
            exit 1
          fi
          case "$dir" in /*) ;; *) dir="/$dir" ;; esac
          case "$dir" in */) ;; *) dir="${dir}/" ;; esac
          echo "Using production server-dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build and upload production dist
        run: npm run build

      - name: Upload production dist to Plesk via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ steps.ftp-config.outputs.protocol }}
          port: 21
          security: loose
          timeout: 180000
          local-dir: frontend/dist/
          server-dir: ${{ steps.ftp-server-dir-prod.outputs.dir }}
          dangerous-clean-slate: false
          log-level: standard

      - id: ftp-server-dir-demo
        name: Prepare demo FTP server-dir
        env:
          FTP_REMOTE_DIR_DEMO: ${{ secrets.FTP_REMOTE_DIR_DEMO }}
        run: |
          dir="${FTP_REMOTE_DIR_DEMO// /}"
          if [ -z "$dir" ]; then
            echo "::warning::FTP_REMOTE_DIR_DEMO is not set; skipping demo site deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$dir" in /*) ;; *) dir="/$dir" ;; esac
          case "$dir" in */) ;; *) dir="${dir}/" ;; esac
          echo "Using demo server-dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build demo dist
        if: steps.ftp-server-dir-demo.outputs.skip != 'true'
        run: npm run build:demo

      - name: Upload demo dist to Plesk via FTP
        if: steps.ftp-server-dir-demo.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ steps.ftp-config.outputs.protocol }}
          port: 21
          security: loose
          timeout: 180000
          local-dir: frontend/dist/
          server-dir: ${{ steps.ftp-server-dir-demo.outputs.dir }}
          dangerous-clean-slate: false
          log-level: standard
