name: Deploy API to Plesk (FTP)
# Monorepo: runs only when backend/ (or this file) changes — not with frontend deploy.
# Use a dedicated FTP user whose Plesk home IS the API site folder (sciencebaseschool.com).
# Uploads go to FTP login root (./). IIS locks DLLs while running — deploy renames web.config → web1.config around upload (same as manual).
# Secrets:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD — API-scoped FTP account only
#   FTP_PROTOCOL — optional (ftp | ftps)

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  API_PROJECT: School.API/School.API.csproj
  PUBLISH_DIR: ./publish

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} -c Release --no-restore

      - name: Publish (verify)
        run: dotnet publish ${{ env.API_PROJECT }} -c Release --no-build -o ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and publish
        run: |
          dotnet restore ${{ env.API_PROJECT }}
          dotnet publish ${{ env.API_PROJECT }} -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Verify publish output (API binaries)
        run: |
          set -euo pipefail
          test -f "${{ env.PUBLISH_DIR }}/School.API.dll"
          test -f "${{ env.PUBLISH_DIR }}/School.Application.dll"
          test -f "${{ env.PUBLISH_DIR }}/School.Infrastructure.dll"
          ls -la "${{ env.PUBLISH_DIR }}/School."*.dll

      - id: ftp-config
        name: Prepare FTP options
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          protocol="${FTP_PROTOCOL:-ftp}"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Stop IIS app (release DLL locks)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ steps.ftp-config.outputs.protocol }}
        run: |
          set -euo pipefail
          case "$FTP_PROTOCOL" in
            ftps|ftps-legacy) OPEN="ftps://$FTP_SERVER" ;;
            *) OPEN="$FTP_SERVER" ;;
          esac
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$OPEN" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          mv web.config web1.config
          bye
          EOF

      - name: Upload to API FTP home (sciencebaseschool.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ steps.ftp-config.outputs.protocol }}
          port: 21
          security: loose
          timeout: 300000
          local-dir: backend/publish/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.json
            **/appsettings.*.json
            **/web.config

      - name: Start IIS app (restore web.config)
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ steps.ftp-config.outputs.protocol }}
        run: |
          set -euo pipefail
          case "$FTP_PROTOCOL" in
            ftps|ftps-legacy) OPEN="ftps://$FTP_SERVER" ;;
            *) OPEN="$FTP_SERVER" ;;
          esac
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$OPEN" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          mv web1.config web.config
          bye
          EOF
